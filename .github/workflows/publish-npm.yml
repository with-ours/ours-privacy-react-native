name: Publish NPM

on:
  pull_request:
    types: [closed]
    branches: [dev]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.1.0)"
        required: true

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # Build + test runs without id-token: write and without npm registry creds,
  # so a malicious dep installed by `npm ci` cannot exfiltrate publish auth.
  # Tarball is handed to the publish job via artifact.
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.title, 'release:'))
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(echo "$PR_TITLE" | grep -oP '\d+\.\d+\.\d+')
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not extract version"
            exit 1
          fi

          # Verify package.json matches the release version
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release version ($VERSION)"
            echo "The PR must include the version bump in package.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - run: npm ci

      - run: npm test

      - run: npx tsc --noEmit

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: oursprivacy-react-native-*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publish runs in an isolated job: no `npm ci`, no project deps loaded.
  # `npm publish <tarball>` does not execute package lifecycle scripts, so
  # no third-party JS runs in this job's env. Auth is via npm Trusted
  # Publisher (OIDC) — the GitHub OIDC token is exchanged for a short-lived
  # npm publish token at publish time, so no long-lived NPM_TOKEN is needed.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # push release tag, create GitHub release
      id-token: write # OIDC token for npm Trusted Publisher + provenance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .

      - name: Publish tarball to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "oursprivacy-react-native-${VERSION}.tgz" --access public --provenance

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes
