name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK (Node ${{ matrix.node }}, RN 0.87)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --runInBand

  sdk-floor:
    name: SDK (Node 22, RN 0.76)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm pkg set devDependencies.react-native=0.76.9 devDependencies.react=18.3.1 "devDependencies.@react-native-async-storage/async-storage=2.2.0"
      - run: npm install --package-lock=false --ignore-scripts
      - run: node -e "const assert=require('node:assert/strict'); assert.equal(require('react-native/package.json').version, '0.76.9'); assert.equal(require('react/package.json').version, '18.3.1'); assert.equal(require('@react-native-async-storage/async-storage/package.json').version, '2.2.0')"
      - run: npm test -- --runInBand
      - run: npm run typecheck

  demo-static:
    name: Demo static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Demo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [sdk, sdk-floor, demo-static]
    if: always()
    steps:
      - name: Require SDK and demo checks
        env:
          SDK_RESULT: ${{ needs.sdk.result }}
          FLOOR_RESULT: ${{ needs.sdk-floor.result }}
          DEMO_RESULT: ${{ needs.demo-static.result }}
        run: |
          for result in "$SDK_RESULT" "$FLOOR_RESULT" "$DEMO_RESULT"; do
            test "$result" = success
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [sdk, sdk-floor, demo-static]
    if: always()
    steps:
      - name: Require SDK and demo checks
        env:
          SDK_RESULT: ${{ needs.sdk.result }}
          FLOOR_RESULT: ${{ needs.sdk-floor.result }}
          DEMO_RESULT: ${{ needs.demo-static.result }}
        run: |
          for result in "$SDK_RESULT" "$FLOOR_RESULT" "$DEMO_RESULT"; do
            test "$result" = success
          done
